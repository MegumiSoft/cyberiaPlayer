name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # necesario para adjuntar los binarios a un Release cuando se sube un tag

env:
  WAILS_VERSION: v2.10.2

jobs:
  test:
    name: Tests (Go + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar yt-dlp y ffmpeg (para los tests de integración)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user -r requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tests del backend (subpaquetes, sin Wails)
        run: go test -race -count=1 ./src/backend/*/...
      - name: Typecheck y build del frontend
        working-directory: src/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: windows/amd64
            artifact: Cyberia-windows
          - name: macos
            os: macos-latest
            platform: darwin/universal
            artifact: Cyberia-macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Resolver dependencias de Go
        run: go mod tidy
      - name: Compilar
        run: wails build -platform ${{ matrix.platform }} -clean

      - name: Empaquetar (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/*.exe -DestinationPath ${{ matrix.artifact }}.zip
      - name: Empaquetar (macOS)
        if: matrix.name == 'macos'
        run: ditto -c -k --keepParent build/bin/*.app ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
